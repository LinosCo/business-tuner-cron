    timeout-minutes: 10
    concurrency: { group: cron-bt-activity-overdue, cancel-in-progress: false }
    steps:
      - name: Activity Overdue Reminders (BT)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 9
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            curl ${CURL_OPTS} -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ secrets.BT_DEPLOY_URL }}/api/cron/activity-overdue"

  bt-source-cadence-reminder:
    # S1.4 — promemoria al maintainer di una fonte la cui cadenza dichiarata e
    # scaduta (settimanale/mensile/trimestrale su CtSource.cadenceDays). Il
    # campo e la UI esistono dal 6 agosto; il producer e la route cron pure.
    # Mancava solo chi lo invocasse: la riga di registro S1.4 dichiara
    # esplicitamente "la schedulazione esterna resta fuori da questo
    # repository", ed e questo il job che chiude il gap (F0-7).
    #
    # Il retry e sicuro per la stessa ragione di bt-activity-overdue:
    # `emitSourceCadenceReminders` incorpora la data UTC nella propria
    # eventKey, quindi un secondo giro nello stesso giorno non produce un
    # secondo richiamo, mentre una fonte ancora in ritardo il giorno dopo ne
    # produce uno nuovo.
    #
    # 07:30 UTC = 09:30 in Italia d'estate. Piu tardi dei richiami attivita
    # (05:30) di proposito: una cadenza scaduta non e urgente come un task
    # scaduto, e cosi le due notifiche non arrivano insieme.
    #
    # Nessun gate sul preflight di pausa: quello e specifico di Strategy Tuner.
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'bt-source-cadence-reminder' || github.event.inputs.job == 'all'))
      || github.event.schedule == '30 7 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: cron-bt-source-cadence-reminder, cancel-in-progress: false }
    steps:
      - name: Source Cadence Reminders (BT)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 9
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            curl ${CURL_OPTS} -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ secrets.BT_DEPLOY_URL }}/api/cron/source-cadence-reminder"

  bt-context-assembly-prune:
    # L5-F — pota le righe di ProjectContextAssembly che non hanno prodotto
    # nulla di persistito e hanno passato i 30 giorni di ritenzione. Le righe
    # COLLEGATE a un suggerimento non vengono mai toccate: sono la memoria di
    # come quel suggerimento e nato, ed e il motivo per cui la tabella esiste.
    #
    # Senza questo job la tabella crescerebbe quanto il numero totale di
    # chiamate AI mai effettuate: e il costo che la spec del motore visibile
    # segnalava come principale per la strada del registro.
    #
    # Il retry e sicuro perche la cancellazione e idempotente: una deleteMany
    # con la stessa clausola, ripetuta, non ha altro da cancellare.
    #
    # 09:30 UTC e non 02:00 come previsto in origine: tutti gli slot fra
    # 00:00 e 09:00 sono gia occupati, e la potatura non ha nessun vincolo di
    # orario — nessuno la aspetta e non manda notifiche.
    #
    # Nessun gate sul preflight di pausa: quello e specifico di Strategy Tuner.
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'bt-context-assembly-prune' || github.event.inputs.job == 'all'))
      || github.event.schedule == '30 9 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: cron-bt-context-assembly-prune, cancel-in-progress: false }
    steps:
      - name: Context Assembly Prune (BT)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 9
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            curl ${CURL_OPTS} -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ secrets.BT_DEPLOY_URL }}/api/cron/context-assembly-prune"

  bt-periodic-reading:
    # GTM-F — emette `PERIODIC_READING_READY` per ogni progetto con
    # un'organizzazione e un OWNER: «la lettura del periodo e pronta da
    # guardare». La lettura in se esiste gia e si apre a richiesta; questo job
    # e la meta che mancava, cioe la periodicita.
    #
    # NON genera la sintesi e NON spende crediti. Il paragrafo scritto dal
    # modello resta subordinato a un atto esplicito di una persona sulla
    # pagina — di proposito, perche generarlo per ogni progetto ogni settimana
    # sarebbe una spesa ricorrente che nessuno ha chiesto. Qui parte solo il
    # richiamo.
    #
    # Il retry e sicuro per la stessa ragione di bt-activity-overdue e
    # bt-source-cadence-reminder: `emitPeriodicReadingReminders` incorpora la
    # data UTC nella propria eventKey, quindi un secondo giro nello stesso
    # giorno non produce un secondo richiamo.
    #
    # Lunedi 06:00 UTC = 08:00 in Italia d'estate, ed e l'orario che il
    # monorepo dichiara gia in `BT_CRON_JOBS` (`0 6 * * 1`): sceglierne un
    # altro qui creerebbe una terza verita sulla stessa cadenza. Lo slot e
    # libero da quando cms-generate-suggestions e stato ritirato.
    #
    # Nessun gate sul preflight di pausa: quello e specifico di Strategy Tuner.
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'bt-periodic-reading' || github.event.inputs.job == 'all'))
      || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: cron-bt-periodic-reading, cancel-in-progress: false }
    steps:
      - name: Periodic Reading Ready (BT)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 9
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            curl ${CURL_OPTS} -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ secrets.BT_DEPLOY_URL }}/api/cron/periodic-reading"

  bt-governance-emails:
    # D-03 — motore di RITENTATIVO per le email di governance (decisione d'area
    # richiesta). Prima di questo job il worker esisteva e non lo invocava
    # nessuno.
    #
    # Cosa attiva, e cosa NON attiva. `AREA_PROPOSAL_EMAIL_TRANSPORT` non
    # impostata vale `legacy`, e in `legacy` l'email parte GIA' in linea alla
    # creazione della proposta: questo job non cambia nulla per gli invii che
    # riescono. Cambia tutto per quelli che falliscono — `completeInboxEmailDelivery`
    # programma il ritentativo (3 tentativi, 60s di distanza) e finora non lo
    # eseguiva nessuno, quindi un'email di governance critica fallita era persa
    # per sempre, in silenzio.
    #
    # Perche' ogni 15 minuti e non giornaliero: la distanza fra i tentativi e'
    # di 60 secondi e un claim diventa stale dopo 15 minuti — con una cadenza
    # giornaliera quei numeri non vorrebbero dire niente. 15 minuti allinea il
    # job alla finestra di staleness: un claim abbandonato viene ripreso alla
    # corsa successiva. A vuoto costa una sola query indicizzata che torna zero
    # righe, ed e' bounded (20 receipt per invocazione, tetto duro a 100).
    #
    # Il retry HTTP qui e' sicuro: la consegna e' claim-based
    # (`updateMany` condizionale sullo stato), quindi due esecuzioni
    # sovrapposte non possono inviare due volte lo stesso receipt.
    #
    # Nessun gate sul preflight di pausa: quello e' specifico di Strategy Tuner.
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'bt-governance-emails' || github.event.inputs.job == 'all'))
      || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `cancel-in-progress: true` e non `false` come gli altri job BT. Con `false`
    # una corsa che resta in coda per mancanza di runner diventa "pending", e
    # all'arrivo della terza GitHub la cancella — la corsa risulta fallita senza
    # che nulla sia rotto (e' successo alle 16:26 e 16:43 UTC del 6 ago: job
    # cancellati dopo 15 minuti, senza log, perche' non erano mai partiti).
    # Superare una corsa vecchia e' qui la semantica GIUSTA, non un compromesso:
    # la consegna e' claim-based e i receipt non consegnati restano dovuti, quindi
    # la corsa successiva riprende esattamente da dove si era fermata.
    concurrency: { group: cron-bt-governance-emails, cancel-in-progress: true }
    steps:
      - name: Governance Emails (BT)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 4
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            curl ${CURL_OPTS} -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ secrets.BT_DEPLOY_URL }}/api/cron/governance-emails"

