  # ═══════════════════════════════════════════════════════════════════════
  # Failure alerting — runs once after the rest of the job graph completes
  # ═══════════════════════════════════════════════════════════════════════
  notify-on-failure:
    needs:
      - st-cron-preflight
      - st-dispatch-scheduled
      - ct-dispatch-scheduled
      # Job BT. Erano tutti fuori da questa lista — nessun commento spiegava
      # perche', e il risultato era che un fallimento di scadenza trial, di
      # pulizia audit o di richiamo attivita' non arrivava a nessuno. Ora ci
      # sono: `if: always() && contains(needs.*.result, 'failure')` ignora i
      # risultati `skipped` e `cancelled`, quindi aggiungerli non produce
      # allerte quando semplicemente non tocca a loro girare.
      - bt-governance-emails
      - bt-expire-trials
      - bt-audit-retention-cleanup
      - bt-activity-overdue
      - bt-source-cadence-reminder
      - ct-cleanup-media-uploads
      - st-signal-classify-retry
      - st-signal-ingestion-proactive
      - st-signal-ingestion-full
      - st-ingest-et-visits
      - st-reset-credits
      - st-idempotency-cleanup
      - st-aggregate-chatbot-analytics
      - st-backup-db
      - st-cms-sync-analytics
      - st-run-all
      - st-performance-snapshot
      - st-check-alerts
      - st-interview-quality-alerts
      - st-signal-ingestion-trends
      - st-tip-verify
      - st-gap-to-content
      - st-signal-cleanup
      - st-tip-retry-failed
      - st-oauth-token-refresh
      - st-breach-deadline-alerts
      - st-performance-backfill
      - st-signals-reclassify-pending
      - st-detect-gaps
      - st-sync-insights
      - st-cms-generate-suggestions
      - st-serp-monitoring
      - st-market-themes
      - st-kb-growth
      - st-reset-monthly-counters
      - st-partner-fees
      - st-assessment-maintenance
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    env:
      SLACK_CRON_WEBHOOK: ${{ secrets.SLACK_CRON_WEBHOOK }}
    steps:
      - name: Notify Slack
        run: |
          if [ -z "${SLACK_CRON_WEBHOOK}" ]; then
            echo "SLACK_CRON_WEBHOOK is not configured — skipping notification."
            exit 0
          fi
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"Cron failure in ${GITHUB_REPOSITORY} (run ${GITHUB_RUN_ID}). See https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "${SLACK_CRON_WEBHOOK}"
