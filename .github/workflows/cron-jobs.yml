  st-kb-growth:
    needs: st-cron-preflight
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'st-kb-growth' || github.event.inputs.job == 'all'))
      || (github.event.schedule == '0 10 * * 1'
