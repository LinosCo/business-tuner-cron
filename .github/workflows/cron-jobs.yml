          max_attempts: 2
          retry_wait_seconds: 30
          command: |
            curl ${CURL_OPTS} \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ secrets.ST_DEPLOY_URL }}/api/cron/tip-lifecycle"

  st-tip-performance:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'st-tip-performance' || github.event.inputs.job == 'all')
