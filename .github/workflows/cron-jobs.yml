      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'st-signals-reclassify-pending' || github.event.inputs.job == 'all'))
      || (github.event.schedule == '0 11 * * *'
          && needs.st-cron-preflight.outputs.all != 'true'
          && !contains(fromJson(needs.st-cron-preflight.outputs.paused), 'signals'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: cron-st-signals-reclassify-pending, cancel-in-progress: false }
    steps:
      - name: Signals Reclassify Pending
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 9
          max_attempts: 2
          retry_wait_seconds: 30
          command: |
            curl ${CURL_OPTS} -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ secrets.ST_DEPLOY_URL }}/api/cron/signals/reclassify-pending"

  # ═══════════════════════════════════════════════════════════════════════
  # Tip-lifecycle + tip-performance are wrapped inside `st-run-all` (03:30).
  # Expose them as standalone workflow_dispatch targets for manual reruns.
