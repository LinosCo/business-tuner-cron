          command: |
            curl ${CURL_OPTS} \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ secrets.ST_DEPLOY_URL }}/api/cron/cms-generate-suggestions"

  st-serp-monitoring:
    needs: st-cron-preflight
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'st-serp-monitoring' || github.event.inputs.job == 'all'))
      || (github.event.schedule == '0 8 * * 1'
          && needs.st-cron-preflight.outputs.all != 'true'
          && !contains(fromJson(needs.st-cron-preflight.outputs.paused), 'market'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
